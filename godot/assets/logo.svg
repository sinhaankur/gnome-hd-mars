<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9b982"/>
      <stop offset="0.45" stop-color="#8a7a48"/>
      <stop offset="0.55" stop-color="#6b5c34"/>
      <stop offset="1" stop-color="#3d3420"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.5" stop-color="#ff8a1e"/>
      <stop offset="1" stop-color="#c34a08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <pattern id="hazard" width="28" height="28" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#1a160c"/>
      <rect width="14" height="28" fill="#e0a020"/>
    </pattern>
  </defs>

  <!-- backdrop plate -->
  <rect width="1024" height="512" fill="#0e0d09"/>
  <rect x="24" y="24" width="976" height="464" fill="#16140d" stroke="#2b2718" stroke-width="3"/>
  <!-- corner rivets -->
  <g fill="#3a3520">
    <circle cx="48" cy="48" r="7"/><circle cx="976" cy="48" r="7"/>
    <circle cx="48" cy="464" r="7"/><circle cx="976" cy="464" r="7"/>
  </g>

  <!-- top hazard stripe -->
  <rect x="60" y="86" width="904" height="18" fill="url(#hazard)" opacity="0.9"/>

  <!-- main wordmark -->
  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" text-anchor="middle" filter="url(#shadow)">
    <text x="512" y="292" font-size="200" letter-spacing="8" fill="url(#metal)"
          stroke="#1c1810" stroke-width="6" paint-order="stroke">G-NOME</text>
  </g>

  <!-- ember banner: HD REMASTERED (banner sized to fit the text) -->
  <g>
    <polygon points="286,330 738,330 710,372 314,372" fill="url(#ember)"/>
    <text x="512" y="363" font-family="Arial Black, Impact, sans-serif" font-weight="900"
          font-size="38" letter-spacing="10" text-anchor="middle" fill="#160d04">HD  REMASTERED</text>
  </g>

  <!-- subtitle -->
  <text x="512" y="430" font-family="Consolas, monospace" font-size="30" letter-spacing="10"
        text-anchor="middle" fill="#9a8b5a">TACTICAL  MECH  ASSAULT</text>

  <!-- bottom hazard stripe -->
  <rect x="60" y="452" width="904" height="12" fill="url(#hazard)" opacity="0.75"/>
</svg>
